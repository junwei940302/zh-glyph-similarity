[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-glyph-similarity"
version = "1.0.0"
description = "Chinese homoglyph table: visual similarity for 16,203 Traditional/Simplified Chinese characters, Bopomofo, digits and Latin letters, rendered with real phone fonts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Jun-Wei Huang (黃峻偉)" }]
keywords = ["chinese", "hanzi", "homoglyph", "confusables", "character-similarity", "bopomofo", "zhuyin", "glyph-similarity", "spam-detection", "smishing", "形近字"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Chinese (Traditional)",
  "Natural Language :: Chinese (Simplified)",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
build = ["scipy>=1.10", "pillow>=10.0", "fonttools>=4.40"]

[project.scripts]
glyphsim = "glyphsim.cli:main"

[project.urls]
Homepage = "https://github.com/junwei940302/zh-glyph-similarity"
Releases = "https://github.com/junwei940302/zh-glyph-similarity/releases"

[tool.setuptools]
packages = ["glyphsim"]
